# Type-check, formatting and unit tests, in two jobs.
#
# `check` runs without GDAL or tippecanoe, on every supported Node version: the pure logic — block geometry
# and seams, skip-empty, the block plan, the cache fingerprint, style generation, and the README/config drift
# guard — in seconds. The tests that need the real tools skip themselves there.
#
# `tools` installs GDAL, tippecanoe and Node.js from pixi.lock — the environment `pixi install` gives a
# developer — and runs the tests that need them: the tool checks, the sea-share pyramid, the ocean mask, a GDAL
# progress bar, and tiling and joining block tilesets.
# LANDCOVER_REQUIRE_TOOLS turns a missing tool into a failure, so a broken install cannot pass with those tests
# skipped. Neither job runs the pipeline itself: every stage needs the 23 GB source raster and hours of CPU.
name: CI

on:
   push:
      branches: [main]
   pull_request:

jobs:
   check:
      runs-on: ubuntu-latest
      strategy:
         fail-fast: false
         matrix:
            # 22.18 is the engines floor — the first release with flag-free TypeScript type stripping
            node: ['22.18', '24']
      steps:
         - uses: actions/checkout@v5
         - uses: actions/setup-node@v5
           with:
              node-version: ${{ matrix.node }}
              cache: npm
         - run: npm ci
         - run: npm run check

   tools:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v5
         - uses: prefix-dev/setup-pixi@v0.11.2
           with:
              pixi-version: v0.83.0
              cache: true # the environment, keyed on pixi.lock
         - run: pixi run gdal --version && pixi run tippecanoe --version && pixi run node --version
         - run: pixi run test
           env:
              LANDCOVER_REQUIRE_TOOLS: '1'
