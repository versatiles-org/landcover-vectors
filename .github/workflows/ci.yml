# Type-check, formatting and unit tests.
#
# Deliberately no GDAL / tippecanoe / versatiles here: every pipeline stage needs the 23 GB source
# raster and hours of CPU, so CI covers the pure logic instead — block geometry and seams, skip-empty,
# the block plan, the cache fingerprint, style generation, and the README/config drift guard. Runs in
# seconds, which is what makes it useful on every push.
name: CI

on:
   push:
      branches: [main]
   pull_request:

jobs:
   check:
      runs-on: ubuntu-latest
      strategy:
         fail-fast: false
         matrix:
            # 22.18 is the engines floor — the first release with flag-free TypeScript type stripping
            node: ['22.18', '24']
      steps:
         - uses: actions/checkout@v5
         - uses: actions/setup-node@v5
           with:
              node-version: ${{ matrix.node }}
              cache: npm
         - run: npm ci
         - run: npm run check
