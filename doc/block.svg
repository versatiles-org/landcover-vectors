<text x="48" y="36" font-weight="600" font-size="15">One block: 8 × 8 tiles, read with a margin</text>
<path class="lead" d="M384 116 L462 68"/>
<text x="470" y="72">block edge</text>
<text x="470" y="89" class="muted">the block’s own 64 tiles, one tileset</text>
<path class="lead" d="M392.0 228 L462 146"/>
<text x="470" y="150">margin, 16 px (drawn wider)</text>
<text x="470" y="167" class="muted">pixels of the neighbouring tiles: the sieve’s</text>
<text x="470" y="184" class="muted">context, and the buffer of the edge tiles</text>
<path class="lead" d="M304 316 L462 238"/>
<text x="470" y="242">tile edges are edges of the coverage</text>
<text x="470" y="259" class="muted">neighbouring tiles never share a class code,</text>
<text x="470" y="276" class="muted">so no polygon crosses a tile edge</text>
<text x="470" y="318">class code shift by tile parity</text>
<rect class="c0" x="470" y="332" width="16" height="16"/>
<text x="494" y="344" class="muted">+0  even column, even row</text>
<rect class="c1" x="470" y="354" width="16" height="16"/>
<text x="494" y="366" class="muted">+16  odd column, even row</text>
<rect class="c2" x="470" y="376" width="16" height="16"/>
<text x="494" y="388" class="muted">+32  even column, odd row</text>
<rect class="c3" x="470" y="398" width="16" height="16"/>
<text x="494" y="410" class="muted">+48  odd column, odd row</text>
<text x="48" y="498" class="muted">dashed: neighbouring tiles · hatched: the margin, read but not tiled by this block</text>
</svg>
