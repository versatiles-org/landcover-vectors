# The external tools of the pipeline, from conda-forge, in the versions it needs:
#   micromamba env create -f environment.yml && micromamba activate landcover   (or conda / mamba)
# Node.js and versatiles come separately (see the README's requirements). CI builds its test environment from
# this file too (.github/workflows/ci.yml).
name: landcover
channels:
   - conda-forge
dependencies:
   - gdal>=3.13 # the gdal raster / gdal vector subcommands; with gdal_calc.py
   - numpy # for gdal_calc.py
   - tippecanoe>=2.79
   - curl
